<!doctype html><meta charset="utf-8" /><title>DSH 批注安全载体验收</title>
<style>
  body {
    margin: 0;
    font: 14px system-ui;
  }
  .browser {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .browser form {
    height: 36px;
    flex: none;
  }
  .viewport {
    flex: 1;
    min-height: 0;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  webview {
    width: 100%;
    height: 100%;
    display: flex;
  }
</style>
<div class="browser">
  <form><button type="button">内置浏览器工具栏（隔离验收）</button></form>
  <div class="viewport">
    <webview data-sidebar-browser-frame="webview"></webview>
  </div>
</div>
<script>
  let plugin;
  window.__ModuleLoader__ = {
    load: (entry) => {
      plugin = entry.factory();
    },
  };
</script>
<script src="review.js"></script>
<script>
  (async () => {
    let dispose;
    const assert = (value, message) => {
        if (!value) throw new Error(message || "Assertion failed");
      },
      wait = async (predicate) => {
        for (let i = 0; i < 150; i++) {
          if (await predicate()) return;
          await new Promise((resolve) => setTimeout(resolve, 30));
        }
        throw new Error("Wait failed");
      };
    try {
      const frame = document.querySelector("webview");
      frame.src = new URL(location.href).searchParams.get("fixture");
      await new Promise((resolve) =>
        frame.addEventListener("did-finish-load", resolve, { once: true }),
      );
      const deliveries = [],
        session = {},
        drafts = [];
      let file;
      const ctx = {
        sidebarRight: {
          commandTarget: () => ({ sessionId: "secure-fixture" }),
        },
        sessions: { binding: () => ({ session }) },
        conversation: {
          createDrafts: (_id, files) => {
            file = files[0];
            drafts.push(file);
            return [{ id: "image-1", kind: "image" }];
          },
          sendSession: async (...args) => {
            deliveries.push(args);
            return { kind: "success" };
          },
          releaseDraftAttachments: () => {
            throw new Error("Unexpected release");
          },
        },
      };
      dispose = plugin.installEmbeddedBrowserReview(ctx);
      const shot = document.querySelector('[aria-label="内置浏览器截图"]');
      assert(shot, "Missing independent screenshot entry");
      shot.click();
      await wait(() =>
        document
          .querySelector(".dsh-br-screenshot>img")
          ?.getAttribute("src")
          ?.startsWith("blob:"),
      );
      assert(
        !document.querySelector(".dsh-br-panel"),
        "Screenshot must not open annotation controls",
      );
      await window.fixture.proof("screenshot");
      Array.from(document.querySelectorAll(".dsh-br-screenshot button"))
        .find((button) => button.textContent === "发送到对话")
        .click();
      await wait(() => deliveries.length === 1);
      assert(file.name === "网页截图.png", "Standalone screenshot filename");
      assert(
        deliveries[0][1].startsWith("网页截图\n") &&
          !deliveries[0][1].includes("用户批注"),
        "Screenshot was mixed with annotation",
      );
      deliveries.length = 0;
      drafts.length = 0;
      document.querySelector('[aria-label="内置浏览器批注"]').click();
      await wait(() =>
        document
          .querySelector(".dsh-br-surface>img")
          ?.getAttribute("src")
          ?.startsWith("data:image"),
      );
      const surface = document.querySelector(".dsh-br-surface"),
        image = surface.querySelector("img"),
        editor = document.querySelector('[aria-label="批注意见"]'),
        buttons = () =>
          Array.from(document.querySelectorAll(".dsh-br-panel button")),
        toggle = document.querySelector('[aria-label="内置浏览器批注"]');
      assert(
        !buttons().some((button) =>
          /保存选区|手动框选|元素吸附/.test(button.textContent),
        ),
        "Gestures must not require mode switches or save buttons",
      );
      const viewport = await frame.executeJavaScript(
          "({width:innerWidth,height:innerHeight})",
        ),
        element = await frame.executeJavaScript(
          'document.querySelector("#review-target").getBoundingClientRect().toJSON()',
        ),
        rect = surface.getBoundingClientRect(),
        x = Math.round(
          rect.left +
            ((element.x + element.width / 2) * rect.width) / viewport.width,
        ),
        y = Math.round(
          rect.top +
            ((element.y + element.height / 2) * rect.height) / viewport.height,
        );
      await window.fixture.input([
        { type: "mouseMove", x, y },
        { type: "mouseDown", x, y, button: "left", clickCount: 1 },
        { type: "mouseUp", x, y, button: "left", clickCount: 1 },
      ]);
      await wait(
        () =>
          !document.querySelector(".dsh-br-editor").hidden &&
          document
            .querySelector(".dsh-br-element")
            .textContent.includes("#review-target"),
      );
      assert(
        document.activeElement === editor,
        "Click snapping did not focus the nearby editor",
      );
      const visibleEditor = () => {
        const b = editor.getBoundingClientRect(),
          page = document
            .querySelector(".dsh-br-stage")
            .getBoundingClientRect(),
          style = getComputedStyle(editor);
        assert(
          b.height > 40 &&
            b.top >= page.top &&
            b.bottom <= page.bottom &&
            b.left >= page.left &&
            b.right <= page.right,
          "Floating comment editor outside the browser viewport",
        );
        assert(
          style.color !== style.backgroundColor &&
            style.opacity === "1" &&
            style.webkitTextFillColor === style.color,
          "Comment text is not visibly contrasted",
        );
      };
      visibleEditor();
      await window.fixture.type("点击吸附：保留圆角，改成蓝色");
      assert(
        editor.value.includes("保留圆角"),
        "Native typing did not appear after click selection",
      );
      assert(
        !buttons().find((button) => button.textContent === "发送批注（含截图）")
          .disabled,
        "Typed annotation must be sendable without saving",
      );
      document.querySelector(".dsh-br-editor button").click();
      assert(
        document.querySelector(".dsh-br-editor").hidden,
        "Continue should dismiss the editor without losing the note",
      );
      const area = surface.getBoundingClientRect(),
        dragX = Math.round(area.left + area.width * 0.15),
        dragY = Math.round(area.top + area.height * 0.6);
      await window.fixture.input([
        { type: "mouseMove", x: dragX, y: dragY },
        {
          type: "mouseDown",
          x: dragX,
          y: dragY,
          button: "left",
          clickCount: 1,
        },
        { type: "mouseMove", x: dragX + 180, y: dragY + 80, buttons: ["left"] },
        {
          type: "mouseUp",
          x: dragX + 180,
          y: dragY + 80,
          button: "left",
          clickCount: 1,
        },
      ]);
      await wait(
        () =>
          !document.querySelector(".dsh-br-editor").hidden &&
          document.querySelector(".dsh-br-element").textContent ===
            "自定义区域",
      );
      const drawn = Array.from(
        document.querySelectorAll(".dsh-br-box:not(.dsh-br-hover)"),
      )
        .at(-1)
        .getBoundingClientRect();
      assert(
        Math.abs(drawn.width - 180) < 3 && Math.abs(drawn.height - 80) < 3,
        "Dragging snapped instead of drawing a free rectangle",
      );
      visibleEditor();
      await window.fixture.type("自由框选：真实输入，直接发送，无需保存");
      assert(
        editor.value.includes("无需保存"),
        "Native text entry is not visible in free rectangle mode",
      );
      document.querySelector(".dsh-br-editor button").click();
      await window.fixture.input([
        { type: "mouseMove", x, y },
        { type: "mouseDown", x, y, button: "left", clickCount: 1 },
        { type: "mouseUp", x, y, button: "left", clickCount: 1 },
      ]);
      await wait(
        () =>
          !document.querySelector(".dsh-br-editor").hidden &&
          editor.value === "",
      );
      Array.from(document.querySelectorAll(".dsh-br-editor button"))
        .find((button) => button.textContent === "删除这条")
        .click();
      assert(
        document.querySelectorAll(".dsh-br-box>button").length === 2,
        "Deleting an empty draft removed a written annotation",
      );
      const marker = document
          .querySelectorAll(".dsh-br-box>button")[1]
          .getBoundingClientRect(),
        markerX = Math.round(marker.left + marker.width / 2),
        markerY = Math.round(marker.top + marker.height / 2);
      await window.fixture.input([
        { type: "mouseMove", x: markerX, y: markerY },
        {
          type: "mouseDown",
          x: markerX,
          y: markerY,
          button: "left",
          clickCount: 1,
        },
        {
          type: "mouseUp",
          x: markerX,
          y: markerY,
          button: "left",
          clickCount: 1,
        },
      ]);
      await wait(
        () =>
          editor.value.includes("无需保存") &&
          !document.querySelector(".dsh-br-editor").hidden,
      );
      await window.fixture.resize({ width: 480, height: 600 });
      await new Promise((resolve) => setTimeout(resolve, 100));
      visibleEditor();
      document.documentElement.style.setProperty(
        "--dsw-alias-bg-layer-1",
        "#172033",
      );
      document.documentElement.style.setProperty(
        "--dsw-alias-label-primary",
        "#f1f5f9",
      );
      visibleEditor();
      document.documentElement.style.removeProperty("--dsw-alias-bg-layer-1");
      document.documentElement.style.removeProperty(
        "--dsw-alias-label-primary",
      );
      await wait(() =>
        document.querySelector(".dsh-br-preview").src.startsWith("blob:"),
      );
      toggle.click();
      assert(
        document.querySelector(".dsh-br-stage").getBoundingClientRect()
          .height === 0,
        "Closing left annotation overlays visible",
      );
      assert(
        frame.style.width === "",
        "Closing did not restore browser viewport",
      );
      toggle.click();
      assert(
        editor.value.includes("无需保存"),
        "Closing lost the active comment draft",
      );
      buttons()
        .find((button) => button.textContent === "关闭（保留草稿）")
        .click();
      assert(
        document.querySelector(".dsh-br-stage").hidden,
        "Close action left its overlay active",
      );
      toggle.click();
      await new Promise(requestAnimationFrame);
      visibleEditor();
      const includeImage = document.querySelector(
        ".dsh-br-panel input[type=checkbox]",
      );
      includeImage.click();
      assert(
        document.querySelector(".dsh-br-preview").hidden,
        "Annotation image should be optional",
      );
      assert(
        buttons().some((button) => button.textContent === "发送批注（仅文字）"),
        "Missing text-only action",
      );
      includeImage.click();
      await wait(async () => {
        const current = await frame.executeJavaScript(
          "({width:innerWidth,height:innerHeight})",
        );
        return (
          current.width === viewport.width && current.height === viewport.height
        );
      });
      const priorViewport = await frame.executeJavaScript(
        "({width:innerWidth,height:innerHeight})",
      );
      await window.fixture.resize({ width: 1400, height: 900 });
      await new Promise((resolve) => setTimeout(resolve, 150));
      const after = surface.getBoundingClientRect(),
        afterViewport = await frame.executeJavaScript(
          "({width:innerWidth,height:innerHeight})",
        );
      assert(
        Math.abs(
          after.width / after.height - image.naturalWidth / image.naturalHeight,
        ) < 0.01,
        "Image stretched on resize",
      );
      assert(
        afterViewport.width === priorViewport.width &&
          afterViewport.height === priorViewport.height,
        "Guest viewport changed while annotating",
      );
      visibleEditor();
      await window.fixture.proof();
      await window.fixture.type("；最后输入也必须提交");
      buttons()
        .find((button) => button.textContent === "发送批注（含截图）")
        .click();
      await wait(() => deliveries.length === 1);
      assert(deliveries[0][0] === session, "Wrong session");
      assert(
        JSON.stringify(deliveries[0][2]) === '["image-1"]',
        "Wrong attachments",
      );
      assert(
        deliveries[0][1].includes("button#review-target") &&
          deliveries[0][1].includes("border-radius"),
        "Missing snapped element CSS evidence",
      );
      assert(
        deliveries[0][1].includes("保留圆角") &&
          deliveries[0][1].includes("自由框选") &&
          deliveries[0][1].includes("最后输入"),
        "Send dropped a current unsaved comment",
      );
      assert(file.type === "image/png" && file.size > 3000, "Missing PNG");
      assert(frame.style.width === "", "Send did not restore viewport");
      assert(
        !document.querySelector(".dsh-br-stage"),
        "Send left annotation overlays behind",
      );

      const png = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
      window.fixture.report({
        pass: true,
        independentScreenshot: true,
        trustedCustomRectangle: true,
        nativeCommentInput: true,
        clickSnapsDragSelects: true,
        nearbyVisibleEditor: true,
        narrowPanelAndDarkTextVisible: true,
        noSaveStep: true,
        editByNumberAndDelete: true,
        closeHidesOverlays: true,
        unsentDraftPreserved: true,
        screenshotDidNotOpenAnnotation: true,
        annotationImageOptional: true,
        contextIsolation: true,
        sandbox: true,
        nodeIntegration: false,
        elementSnapping: true,
        cssSelector: true,
        computedStyle: true,
        fullScreenAspectRatio: true,
        stableGuestViewport: true,
        pngBytes: file.size,
        ownAttachmentOnly: true,
        png,
      });
    } catch (error) {
      window.fixture.report({ pass: false, error: error.stack });
    } finally {
      dispose?.();
    }
  })();
</script>
